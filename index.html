<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day at the Cathedral</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="viewport">
      <canvas id="app"></canvas>
    </main>
    <form id="control-panel" aria-label="Render controls">
      <label class="switch-row">
        <span>Raytracing</span>
        <input id="raytrace-toggle" type="checkbox" checked />
      </label>
      <label class="control-row">
        <span>Resolution</span>
        <output id="resolution-output" for="resolution-scale">50%</output>
        <input id="resolution-scale" type="range" min="0.25" max="1" step="0.05" value="0.5" />
      </label>
      <label class="switch-row">
        <span>Fit</span>
        <input id="fit-toggle" type="checkbox" checked />
      </label>
      <label class="control-row">
        <span>Width</span>
        <output id="width-output" for="viewport-width">1280px</output>
        <input id="viewport-width" type="range" min="480" max="2560" step="20" value="1280" />
      </label>
      <label class="control-row">
        <span>Height</span>
        <output id="height-output" for="viewport-height">720px</output>
        <input id="viewport-height" type="range" min="320" max="1440" step="20" value="720" />
      </label>
    </form>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
